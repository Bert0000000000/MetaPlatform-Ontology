openapi: 3.1.0
info:
  title: MetaPlatform v6.0 - mp-ai (LLM Gateway)
  version: 6.0.0
  description: |
    LLM 网关 API（OpenAI 兼容协议）。基于 dsh 的 llm-pi-ai + llm-deepseek provider。
    配套 PRD：docs/active/prd/mp-ai.md

servers:
  - url: https://api.mp-platform.local/ai/v1
    description: 生产

security:
  - bearerAuth: []

paths:
  /chat/completions:
    post:
      summary: Chat completion（OpenAI 兼容）
      operationId: createChatCompletion
      tags: [completions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/ChatCompletionChunk' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Token quota exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /embeddings:
    post:
      summary: Embedding
      operationId: createEmbedding
      tags: [embeddings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbeddingRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingResponse' }

  /models:
    get:
      summary: 列出可用模型
      operationId: listModels
      tags: [models]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Model' }

  /usage:
    get:
      summary: Token 用量
      operationId: getUsage
      tags: [usage]
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_tokens: { type: integer }
                  prompt_tokens: { type: integer }
                  completion_tokens: { type: integer }
                  by_model:
                    type: object
                    additionalProperties:
                      type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, examples: ['deepseek-chat', 'gpt-4o'] }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant, tool]
              content: {}
              name: { type: string }
        temperature: { type: number, minimum: 0, maximum: 2, default: 1 }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
        tools:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [function] }
              function:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string }
                  parameters: { type: object }
        tenant_id: { type: string, format: uuid, description: 'Required. Tenant context for quota + RLS.' }

    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                type: object
                properties:
                  role: { type: string }
                  content: { type: string, nullable: true }
                  tool_calls:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [function] }
                        function:
                          type: object
                          properties:
                            name: { type: string }
                            arguments: { type: string }
              finish_reason: { type: string, enum: [stop, length, tool_calls, content_filter] }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }

    ChatCompletionChunk:
      type: object
      properties:
        id: { type: string }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              delta: {}
              index: { type: integer }
              finish_reason: { type: string, nullable: true }

    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string }
        input: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
        tenant_id: { type: string, format: uuid }

    EmbeddingResponse:
      type: object
      properties:
        model: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              embedding:
                type: array
                items: { type: number }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            total_tokens: { type: integer }

    Model:
      type: object
      properties:
        id: { type: string }
        provider: { type: string, enum: [deepseek, openai, anthropic] }
        context_window: { type: integer }
        max_output_tokens: { type: integer }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            type: { type: string }
        traceId: { type: string }