openapi: 3.1.0
info:
  title: MetaPlatform v6.0 - mp-agent-team (WebSocket Protocol)
  version: 6.0.0
  description: |
    数字员工 WebSocket 双向通信协议。
    配套 PRD：docs/active/prd/mp-agent-team.md

servers:
  - url: wss://api.mp-platform.local/agent/v1

tags:
  - name: sessions
    description: Session 管理（HTTP 部分）
  - name: websocket
    description: WebSocket 双向消息

paths:
  /sessions:
    post:
      summary: 启动新 session（HTTP 入口）
      operationId: createSession
      tags: [sessions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset, tenantId]
              properties:
                preset: { type: string, examples: ['customer-service'] }
                tenantId: { type: string, format: uuid }
                initialMessage: { type: string }
                metadata: { type: object }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string, format: uuid }
                  websocketUrl: { type: string, examples: ['wss://api.mp-platform.local/agent/v1/sessions/xxx/ws'] }

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: 获取 session 详情
      operationId: getSession
      tags: [sessions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

    delete:
      summary: 归档 session
      operationId: archiveSession
      tags: [sessions]
      security:
        - bearerAuth: []
      responses:
        '204': { description: No Content }

  /sessions/{sessionId}/ws:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: WebSocket 升级（详情见下）
      operationId: websocketUpgrade
      tags: [websocket]
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        preset: { type: string }
        status:
          type: string
          enum: [active, archived]
        title: { type: string, nullable: true }
        metadata: { type: object }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

# WebSocket 消息协议（OpenAPI 不直接支持 WebSocket，文档化）
x-websocket-protocol:
  description: |
    ## WebSocket 消息协议

    ### 客户端 → 服务端

    ```json
    {
      "type": "message",
      "content": "用户消息内容",
      "id": "client-msg-uuid"
    }
    ```

    或中断生成：

    ```json
    {
      "type": "abort",
      "messageId": "client-msg-uuid"
    }
    ```

    ### 服务端 → 客户端

    流式响应（多个 chunk）：

    ```json
    {
      "type": "message_start",
      "id": "agent-msg-uuid",
      "sessionId": "..."
    }
    ```

    ```json
    {
      "type": "content_delta",
      "id": "agent-msg-uuid",
      "delta": "增量文本"
    }
    ```

    ```json
    {
      "type": "tool_call",
      "id": "tool-call-uuid",
      "name": "search_documents",
      "arguments": {...}
    }
    ```

    ```json
    {
      "type": "tool_result",
      "id": "tool-call-uuid",
      "result": {...}
    }
    ```

    ```json
    {
      "type": "message_end",
      "id": "agent-msg-uuid",
      "finishReason": "stop"
    }
    ```

    ```json
    {
      "type": "error",
      "code": "rate_limit_exceeded",
      "message": "Token quota exceeded"
    }
    ```

  heartbeat: 30 秒（ping/pong）
  reconnection: 客户端断线后指数退避重连（1s/2s/4s/8s/max 30s）