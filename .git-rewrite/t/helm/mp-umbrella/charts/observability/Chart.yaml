# helm/mp-umbrella/charts/observability/Chart.yaml
# PRD: docs/active/prd/otel-collector-config.md
# MP-V6-OBSERVABILITY-01

apiVersion: v2
name: observability
description: OTel Collector + Tempo + Prometheus + Loki + Grafana
type: application
version: 0.1.0
appVersion: "0.103.0"

dependencies:
  - name: opentelemetry-collector
    version: "0.96.0"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otel.enabled
  - name: tempo
    version: "1.6.0"
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled
  - name: prometheus
    version: "25.5.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: loki
    version: "5.41.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  - name: grafana
    version: "7.3.0"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled