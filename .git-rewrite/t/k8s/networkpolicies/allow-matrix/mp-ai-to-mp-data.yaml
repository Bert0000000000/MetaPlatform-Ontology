# k8s/networkpolicies/allow-matrix/mp-ai-to-mp-data.yaml
# PRD: docs/active/prd/foundation-networkpolicy.md §4.2
# mp-ai (graphrag / ragflow / embedding) → mp-data (PG 向量检索)

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mp-ai-to-mp-data
  namespace: mp-ai
  labels:
    platform.mp/version: "v6.0"
    platform.mp/tier: "foundation"
spec:
  podSelector:
    matchLabels:
      platform.mp/role: "ai-service"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mp-data
              kubernetes.io/metadata.namespace: mp-data
      ports:
        - protocol: TCP
          port: 5432