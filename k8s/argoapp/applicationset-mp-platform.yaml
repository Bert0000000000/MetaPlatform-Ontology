# k8s/argoapp/applicationset-mp-platform.yaml
# PRD: docs/active/prd/deploy-gitops.md §4.1
# Batch: MP-V6-DEPLOY-01
# ArgoCD ApplicationSet: 一份 yaml 部署 3 集群 (dev / staging / prod)

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mp-platform
  namespace: mp-infra
  labels:
    platform.mp/version: "v6.0"
spec:
  goTemplate: true
  generators:
    - list:
        name: clusters
        elements:
          - cluster: dev
            url: https://kubernetes.default.svc
            namespace: mp-platform
          - cluster: staging
            url: https://kubernetes.default.svc
            namespace: mp-platform
          - cluster: prod
            url: https://kubernetes.default.svc
            namespace: mp-platform
  template:
    metadata:
      name: 'mp-{{.cluster}}'
      labels:
        platform.mp/cluster: '{{.cluster}}'
        platform.mp/version: "v6.0"
    spec:
      project: mp-platform
      source:
        repoURL: https://github.com/Bert0000000000/MetaPlatform-Ontology
        targetRevision: main
        path: helm/mp-umbrella
        helm:
          valueFiles:
            - values-{{.cluster}}.yaml
      destination:
        server: '{{.url}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
      revisionHistoryLimit: 10
      ignoreDifferences:
        - group: argoproj.io
          kind: Application
          jsonPointers:
            - /spec/source/helm/parameters