# k8s/argoapp/mp-platform-app.yaml
# PRD: docs/active/prd/foundation-k8s-clusters.md §4
# ArgoCD Application: mp-umbrella chart 部署到 mp-platform 集群

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mp-umbrella
  namespace: mp-infra  # argocd 部署在 mp-infra ns
  labels:
    platform.mp/version: "v6.0"
spec:
  project: mp-platform
  source:
    repoURL: https://github.com/Bert0000000000/MetaPlatform-Ontology.git
    targetRevision: main
    path: helm/mp-umbrella
    helm:
      valueFiles:
        - values-<env>.yaml
        - secrets-<env>.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mp-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10