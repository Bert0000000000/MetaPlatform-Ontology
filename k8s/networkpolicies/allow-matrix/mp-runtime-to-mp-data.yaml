# k8s/networkpolicies/allow-matrix/mp-runtime-to-mp-data.yaml
# PRD: docs/active/prd/foundation-networkpolicy.md §4.2
# mp-runtime (dsh runtime / 数字员工) → mp-data (Supabase PG + Storage + Edge + Realtime)
# 端口: 5432 (PG) / 3000 (Storage) / 4000 (Studio) / 54321 (PostgREST + Edge)

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mp-runtime-to-mp-data
  namespace: mp-runtime
  labels:
    platform.mp/version: "v6.0"
    platform.mp/tier: "foundation"
spec:
  podSelector:
    matchLabels:
      platform.mp/role: "dsh-runtime"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mp-data
              kubernetes.io/metadata.namespace: mp-data
      ports:
        - protocol: TCP
          port: 5432   # Postgres
        - protocol: TCP
          port: 3000   # Storage
        - protocol: TCP
          port: 4000   # Studio
        - protocol: TCP
          port: 54321  # PostgREST + Edge