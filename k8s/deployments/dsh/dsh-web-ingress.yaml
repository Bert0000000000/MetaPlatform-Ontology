# k8s/deployments/dsh/dsh-web-ingress.yaml
# PRD: docs/active/prd/dsh-60-packages.md §6.3
# Batch: MetaPlatform-DSH-01
# dsh-web Ingress (TLS via cert-manager)

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsh-web
  namespace: mp-runtime
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"  # 长 SSE 流式响应
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  labels:
    platform.mp/version: "v6.0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dsh.mp-platform.local
      secretName: dsh-web-tls
  rules:
    - host: dsh.mp-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsh-web
                port:
                  number: 80