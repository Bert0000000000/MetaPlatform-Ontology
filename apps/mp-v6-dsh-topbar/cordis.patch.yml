# MetaPlatform dsh-web topbar patch — applied via `dsh web --patch <this-file>`.
#
# Inserts one Cordis plugin row: `mp-v6-topbar`, hosted at apps/mp-v6-dsh-topbar/host.mjs
# (relative path resolved from the loader config directory —
# vendor/deepseek-harness/.dsh-data/profiles/web/ — so the script can be checked
# into the repo and survive fresh clones).
#
# The host plugin uses webServer.register + tapIndex to inject a <script> tag into
# the served index.html. The script prepends a fixed-position <nav> with 4 menu
# items: 云市场 (mp-marketplace), 应用中心 (mp-app-center),
# Ontology 本体平台 (mp-platform-admin), and AI 助手 (mp-ai-assistant →
# dispatches 'dsh:open-chat' CustomEvent so any host code can react).
#
# Navigation: link menus use SPA-internal history.pushState (same-origin) or
# window.location.assign (cross-origin 5173 → 8080) — never target="_blank",
# never opens a new tab.
#
# No dsh source code is modified — pure overlay.

- insert:
    - id: mp-v6-topbar
      name: ../../../../../apps/mp-v6-dsh-topbar/host.mjs
      inject: [webServer]