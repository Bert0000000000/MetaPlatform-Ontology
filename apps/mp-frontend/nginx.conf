# Nginx config — mp-frontend (React SPA + API proxy)
server {
  listen 5174;
  server_name _;

  # gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1000;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback (React Router 客户端路由 → 全部指向 index.html)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源缓存 (1 年)
  location ~* \.(?:css|js|woff2?|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API 代理 (mp-frontend 调 Supabase EF / PostgREST)
  location /api/supabase/ {
    proxy_pass ${SUPABASE_URL}/;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
  }
  location /api/admin/ {
    proxy_pass http://${ADMIN_SERVER}/;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
  }

  # 通用: security headers
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "no-referrer-when-downgrade";

  # HMR / dev server (when in dev)
  location /@vite/ {
    proxy_pass http://${VITE_DEV_SERVER}:5174;
  }
  location /src/ {
    proxy_pass http://${VITE_DEV_SERVER}:5174;
  }
}